<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skills</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="panel">
            <header class="panel-header">
                <h1>Skills</h1>
                <button id="closeBtn" class="close-btn" title="Close (Esc)">&times;</button>
            </header>

            <div id="skillList" class="skill-list"></div>

            <div id="emptyState" class="empty-state hidden">
                No skills are configured.
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
